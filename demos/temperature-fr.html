<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Température</title>
<link rel="stylesheet" href="common.css">
<style>
  #ctx { font-size: 30px; font-style: italic; }
  #ctx b { color: var(--violet); font-style: normal; }
  input[type=range] { width: 420px; accent-color: var(--violet); }
  #tval { font-size: 30px; font-weight: bold; color: var(--violet); min-width: 70px; }
  select { font: inherit; font-size: 22px; padding: 6px; border-radius: 8px; }
</style>
</head>
<body>
<div class="row">
  <select id="prompt"></select>
</div>
<div id="ctx"></div>
<div class="row" style="font-size:26px">
  Température
  <input type="range" id="T" min="0.05" max="3" step="0.05" value="1">
  <span id="tval">1,00</span>
</div>
<div class="bars" id="bars"></div>

<script>
// Probabilités illustratives à la température 1 (pas un vrai modèle)
const PROMPTS = {
  "Le symptôme le plus fréquent de la grippe est la …": {
    ctx: "Le symptôme le plus fréquent de la grippe est la",
    toks: ["fièvre", "toux", "fatigue", "courbature", "céphalée", "sensation", "rhinite", "douleur", "conjonctivite", "amnésie"],
    p:    [0.52, 0.21, 0.10, 0.06, 0.04, 0.025, 0.02, 0.01, 0.004, 0.001]
  },
  "Pour une infection bactérienne, le médecin a prescrit des …": {
    ctx: "Pour une infection bactérienne, le médecin a prescrit des",
    toks: ["antibiotiques", "examens", "analyses", "antalgiques", "soins", "probiotiques", "antiviraux", "vitamines", "conseils", "chocolats"],
    p:    [0.62, 0.14, 0.08, 0.06, 0.03, 0.025, 0.02, 0.01, 0.004, 0.001]
  },
  "L'étudiante infirmière a vérifié le … du patient": {
    ctx: "L'étudiante infirmière a vérifié le",
    toks: ["pouls", "dossier", "bracelet", "traitement", "poids", "pansement", "nom", "cathéter", "taux", "horoscope"],
    p:    [0.33, 0.25, 0.15, 0.10, 0.05, 0.04, 0.03, 0.03, 0.009, 0.001]
  }
};
const sel = document.getElementById("prompt");
Object.keys(PROMPTS).forEach(k => sel.add(new Option(k, k)));
const T = document.getElementById("T"), tval = document.getElementById("tval");
const bars = document.getElementById("bars"), ctx = document.getElementById("ctx");

function probs() {
  const P = PROMPTS[sel.value], t = parseFloat(T.value);
  const z = P.p.map(x => Math.log(x) / t), m = Math.max(...z);
  const e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / s);
}
function render() {
  const P = PROMPTS[sel.value], p = probs();
  tval.textContent = parseFloat(T.value).toFixed(2).replace(".", ",");
  ctx.innerHTML = "« " + P.ctx + " <b>…</b> »";
  bars.innerHTML = P.toks.map((t, i) =>
    `<div class="lab">${t}</div><div class="track"><div class="fill" style="width:${(100 * p[i]).toFixed(1)}%"></div></div><div class="pct">${Math.round(100 * p[i])} %</div>`
  ).join("");
}
T.oninput = render;
sel.onchange = render;
render();
</script>
</body>
</html>

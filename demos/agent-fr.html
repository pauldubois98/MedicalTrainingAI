<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Un agent IA qui utilise des outils</title>
<!-- Step-by-step trace of an agent loop: the model decides to call a tool, the result is added to its context,
     and it continues until it can answer. Traces are pre-written and illustrative (no real model or search is called). -->
<link rel="stylesheet" href="common.css">
<style>
  body { gap: 8px; padding: 8px 16px; }
  select { font: inherit; font-size: 19px; padding: 6px; border-radius: 8px; max-width: 620px; }
  button { font-size: 20px; padding: 0 18px; height: 44px; line-height: 1; display: inline-flex; align-items: center; gap: 6px; }
  .grid { flex: 1; display: grid; grid-template-columns: 400px 1fr; gap: 16px; min-height: 0; }
  #left { display: flex; flex-direction: column; gap: 8px; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tool { font-size: 15px; background: var(--light); border-radius: 20px; padding: 4px 11px; border: 2px solid transparent; transition: all .3s; }
  .tool.used { border-color: var(--violet); background: var(--violet-l); }
  .tool.now { background: var(--violet); color: #fff; transform: scale(1.08); }
  h3 { margin: 0; font-size: 17px; font-weight: normal; color: var(--muted); }
  h3 b { color: var(--ink); }
  svg { width: 100%; flex: 1; }
  .node rect { transition: all .3s; }
  #trace { overflow: auto; display: flex; flex-direction: column; gap: 6px; border: 3px solid var(--light); border-radius: 14px; padding: 8px 10px; }
  .m { font-size: 16.5px; line-height: 1.38; border-radius: 10px; padding: 6px 11px; animation: pop .35s ease; }
  .m .who { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: .05em; display: block; color: var(--muted); }
  .m.user { background: var(--orange-l); }
  .m.think { background: #fff; border: 2px dashed #d6cfce; color: var(--muted); font-style: italic; }
  .m.call { background: var(--violet); color: #fff; font-family: monospace; font-size: 15.5px; }
  .m.call .who { color: #dcedf8; }
  .m.result { background: var(--violet-l); font-size: 15px; }
  .m.result .who { color: var(--violet); }
  .m.approve { background: #fde0ef; border: 2px solid var(--red); }
  .m.approve .who { color: var(--red); }
  .m.answer { background: #d5f1ef; }
  .m.answer .who { color: var(--green); }
  .m ul { margin: 2px 0 0 18px; padding: 0; }
  #stepInfo { font-size: 17px; color: var(--muted); }
  .note { font-size: 13.5px; color: var(--muted); font-style: italic; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="row">
  <select id="scenario"></select>
  <button id="next">Étape suivante ▶</button>
  <button id="auto" class="alt">⏵ Auto</button>
  <button id="reset" class="alt">↺</button>
  <span id="stepInfo"></span>
</div>
<div class="grid">
  <div id="left">
    <h3><b>Outils que le modèle a le droit d'utiliser</b></h3>
    <div id="tools"></div>
    <svg viewBox="0 0 400 330" id="loop"></svg>
    <div class="note">Trace illustrative, écrite pour la formation. Elle montre comment fonctionne un agent ; les résultats de recherche ne sont pas réels.</div>
  </div>
  <div id="trace"></div>
</div>

<script>
const TOOLS = {
  web_search: "🌐 recherche_web", pubmed_search: "📚 recherche_pubmed", read_article: "📄 lire_article",
  kb_search: "🗂️ recherche_base_connaissances", calendar: "📅 agenda", directory: "👥 annuaire_etudiants",
  email_draft: "✉️ brouillon_email", email_send: "📤 envoyer_email",
};
// stage : où l'on en est dans la boucle (user, llm, tool, answer). Chaque étape ajoute un message au contexte.
const SCENARIOS = [
  { label: "1. Littérature : la simulation en formation infirmière",
    tools: ["web_search", "pubmed_search", "read_article", "kb_search"],
    steps: [
      ["user", "user", "Trouve des données récentes sur la formation par simulation des étudiants infirmiers, et résume-les avec des références que je peux vérifier."],
      ["llm", "think", "Il me faut des sources récentes et évaluées par les pairs. Je vais chercher dans PubMed des revues systématiques des 5 dernières années."],
      ["tool", "call", "recherche_pubmed(requete=\"simulation training nursing students\", type=\"systematic review\", annees=\"2021-2026\")", "pubmed_search"],
      ["llm", "result", "<b>5 résultats</b> (titre, revue, année, PMID)<ul><li>Revue systématique A : simulation et compétences cliniques, 32 études</li><li>Méta-analyse B : simulation et confiance en soi des étudiants, 18 essais</li><li>Revue C : simulation virtuelle vs mannequin…</li><li>…</li></ul>"],
      ["llm", "think", "Les revues A et B semblent les plus pertinentes. Je dois lire leurs résumés avant de synthétiser, sans me fier aux seuls titres."],
      ["tool", "call", "lire_article(pmid=\"A\")", "read_article"],
      ["llm", "result", "<b>Résumé A</b> : 32 études ; la simulation améliore les connaissances et les compétences cliniques par rapport à l'enseignement traditionnel ; niveau de preuve modéré ; forte hétérogénéité entre les études."],
      ["tool", "call", "lire_article(pmid=\"B\")", "read_article"],
      ["llm", "result", "<b>Résumé B</b> : 18 essais randomisés ; gain significatif de confiance en soi ; effet sur le maintien des compétences à long terme incertain."],
      ["answer", "answer", "Des revues récentes suggèrent que la simulation améliore les connaissances, les compétences cliniques et la confiance en soi des étudiants infirmiers par rapport à l'enseignement traditionnel [A, B]. Le niveau de preuve est modéré et les études sont hétérogènes ; l'effet à long terme reste incertain [B]. <b>Références avec PMID ci-dessous : vérifiez-les.</b>"],
    ] },
  { label: "2. Administratif : changement de salle pour le TP d'anatomie de demain",
    tools: ["calendar", "directory", "email_draft", "email_send", "web_search"],
    steps: [
      ["user", "user", "Le TP d'anatomie de 2e année de demain est déplacé en salle B12. Préviens les étudiants et leurs tuteurs."],
      ["llm", "think", "Il me faut d'abord l'événement exact : date, heure et salle actuelle."],
      ["tool", "call", "agenda.trouver_evenement(nom=\"TP anatomie\", groupe=\"2e année\", date=\"demain\")", "calendar"],
      ["llm", "result", "TP d'anatomie, 2e année, groupe A, <b>mardi 14 h–17 h</b>, salle A04, enseignant : Dr Martin."],
      ["tool", "call", "annuaire_etudiants.liste(groupe=\"2e année groupe A\", inclure=\"tuteurs\")", "directory"],
      ["llm", "result", "48 étudiants, 3 tuteurs (liste de diffusion : a2-groupe-a@st-aldric.example)."],
      ["tool", "call", "brouillon_email(a=\"a2-groupe-a@…\", objet=\"Changement de salle : TP d'anatomie, mardi 14 h\", …)", "email_draft"],
      ["llm", "result", "Brouillon créé : <i>« Bonjour à tous, le TP d'anatomie de demain (mardi 14 h–17 h) aura lieu en <b>salle B12</b> au lieu de la A04. Le reste est inchangé. Bien cordialement, Dr Martin »</i>"],
      ["user", "approve", "✋ <b>Validation humaine requise</b> avant l'envoi à 51 personnes. L'enseignant relit le brouillon, vérifie la salle et l'horaire, et clique sur « Envoyer »."],
      ["tool", "call", "envoyer_email(id_brouillon=\"…\")", "email_send"],
      ["answer", "answer", "C'est fait : l'e-mail a été envoyé aux 48 étudiants et aux 3 tuteurs du groupe A de 2e année. Voulez-vous que je mette aussi à jour l'événement dans l'agenda ?"],
    ] },
  { label: "3. Nos documents : peut-on porter une montre connectée pendant l'ECOS ?",
    tools: ["kb_search", "web_search", "pubmed_search"],
    steps: [
      ["user", "user", "Les étudiants peuvent-ils porter une montre connectée pendant l'ECOS ?"],
      ["llm", "think", "Cela dépend de notre propre règlement, pas des connaissances générales. Je vais chercher dans la base de connaissances de l'école plutôt que sur le web."],
      ["tool", "call", "recherche_base_connaissances(requete=\"montre connectée ECOS\", top_k=3)", "kb_search"],
      ["llm", "result", "<b>[1] Règlement des ECOS 2026–27, §8 Conduite</b> : « Les téléphones portables et les montres connectées doivent être laissés dans les casiers prévus… »<br><b>[2] Livret des stages, §7 Tenue</b> : « …pas de montre… »"],
      ["answer", "answer", "Non. Les montres connectées, comme les téléphones portables, doivent être laissées dans les casiers prévus (règlement des ECOS, §8) [1]. Plus généralement, en zone de soins, on ne porte pas de montre (« avant-bras dégagés ») [2]."],
    ] },
];

const sel = document.getElementById("scenario"), trace = document.getElementById("trace"), svg = document.getElementById("loop");
SCENARIOS.forEach((s, i) => sel.add(new Option(s.label, i)));
let k = 0, timer = null;
const WHO = { user: "Utilisateur", think: "Modèle (raisonnement)", call: "Modèle → appel d'outil", result: "Résultat de l'outil (ajouté au contexte)",
              approve: "Humain dans la boucle", answer: "Modèle → réponse finale" };

function drawLoop(stage) {
  const box = (x, y, w, h, label, on, color) =>
    `<g class="node"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="${on ? color : "#f3f1f0"}" stroke="${color}" stroke-width="${on ? 0 : 2}"/>` +
    `<text x="${x + w / 2}" y="${y + h / 2}" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="bold" fill="${on && color !== "#ff5700" ? "#fff" : "#382b2d"}">${label}</text></g>`;
  const arr = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#76696b" stroke-width="3" marker-end="url(#ah)"/>`;
  svg.innerHTML = `<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76696b"/></marker></defs>` +
    box(105, 5, 190, 50, "👤 Utilisateur", stage === "user", "#ff5700") +
    arr(200, 57, 200, 108) +
    box(110, 110, 180, 70, "🧠 LLM", stage === "llm", "#007bc4") +
    `<path d="M290,130 C350,130 350,130 350,200" fill="none" stroke="#76696b" stroke-width="3" marker-end="url(#ah)"/>` +
    `<text x="372" y="160" font-size="15" fill="#76696b" text-anchor="middle">appel</text>` +
    box(290, 205, 105, 55, "🛠️ Outil", stage === "tool", "#007bc4") +
    `<path d="M290,240 C220,240 210,215 210,185" fill="none" stroke="#76696b" stroke-width="3" marker-end="url(#ah)"/>` +
    `<text x="250" y="270" font-size="15" fill="#76696b" text-anchor="middle">résultat</text>` +
    arr(150, 182, 120, 262) +
    box(20, 265, 180, 55, "✅ Réponse", stage === "answer", "#00857f");
}
function render() {
  const S = SCENARIOS[sel.value], steps = S.steps.slice(0, k);
  const used = new Set(steps.filter(s => s[3]).map(s => s[3])), now = k && S.steps[k - 1][3];
  document.getElementById("tools").innerHTML = S.tools.map(t =>
    `<span class="tool${used.has(t) ? " used" : ""}${now === t ? " now" : ""}">${TOOLS[t]}</span>`).join("");
  trace.innerHTML = steps.map(([, type, txt]) => `<div class="m ${type}"><span class="who">${WHO[type]}</span>${txt}</div>`).join("") ||
    `<div class="note" style="font-size:17px">Cliquez sur « Étape suivante » pour suivre l'agent.</div>`;
  trace.scrollTop = trace.scrollHeight;
  drawLoop(k ? S.steps[k - 1][0] : null);
  document.getElementById("stepInfo").textContent = `étape ${k} / ${S.steps.length}`;
  document.getElementById("next").disabled = k >= S.steps.length;
}
function next() { const S = SCENARIOS[sel.value]; if (k < S.steps.length) { k++; render(); } else stopAuto(); }
function stopAuto() { clearInterval(timer); timer = null; document.getElementById("auto").textContent = "⏵ Auto"; }
document.getElementById("next").onclick = e => { e.currentTarget.blur(); next(); };
document.getElementById("auto").onclick = e => {
  e.currentTarget.blur();
  if (timer) return stopAuto();
  timer = setInterval(next, 1800); e.currentTarget.textContent = "⏸ Pause";
};
document.getElementById("reset").onclick = e => { e.currentTarget.blur(); stopAuto(); k = 0; render(); };
sel.onchange = () => { sel.blur(); stopAuto(); k = 0; render(); };
document.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === "ArrowRight") next(); });
render();
</script>
</body>
</html>
